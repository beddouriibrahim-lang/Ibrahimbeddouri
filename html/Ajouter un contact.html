<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <fieldset>
            <h1>Ajouter un contacte</h1>
          <table>
        
                <tr>
                    <td><label for="nom">Nom</label></td>
                    <td><input type="text" id="nom" name="nom" placeholder="Nom" pattern="^[A-Za-z]{5,15}$" required></td>
                </tr>
                <tr>
                    <td><label for="prenom">Prénom</label></td>
                    <td><input type="text" id="prenom" name="prenom" placeholder="Prénom" pattern="^[A-Za-z]{5,15}" required></td>
                </tr>
                <tr>
                    <td><label for="telephone">Téléphone</label></td>
                    <td><input type="tel" id="telephone" name="telephone" placeholder="Téléphone" pattern="^\d{10}$"   required></td>
                </tr>
                <tr>
                    <td><label for="email">Email</label></td>
                    <td><input type="email" id="email" name="email" placeholder="Foulen@serveur.ext" required></td>
                </tr>
                <tr>
                    <td><label for="Adress postale">Adress postale</label></td>
                    <td> <textarea name="adress" id="adress postale" placeholder="Rue, ville, Code postale" minlength="6" maxlength="50"></textarea></td>
                </tr>
          </table>
            <input type="submit" value="Valider">
            <input type="reset" value="Annuler">
        </fieldset>
    </form>
</body>
</html>
